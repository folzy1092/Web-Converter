<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Web Converter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="banner" class="wc-banner" hidden></div>

  <section id="pentagon-view">
    <div id="pentagon" class="wc-pentagon"></div>
    <div class="wc-toolbar wc-toolbar-left">
      <button id="open-window-btn" class="wc-icon-btn" title="Открыть в отдельном окне"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></button>
      <button id="update-now-btn" class="wc-icon-btn" title="Обновить курс сейчас"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
    </div>
    <div class="wc-toolbar wc-toolbar-right">
      <button id="theme-toggle" class="wc-icon-btn" title="Сменить тему попапа"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
      <button id="settings-btn" class="wc-icon-btn" title="Настроить валюты"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </section>

  <section id="settings-view" hidden>
    <input id="settings-search" class="wc-search" type="text" placeholder="Поиск валюты...">
    <div id="settings-error" class="wc-error" hidden></div>
    <div id="settings-list" class="wc-list"></div>

    <div class="wc-theme-row">
      <span>Тема подсказки на странице</span>
      <div class="wc-theme-switch">
        <button id="tooltip-theme-light" class="wc-theme-btn" type="button">Светлая</button>
        <button id="tooltip-theme-dark" class="wc-theme-btn" type="button">Тёмная</button>
      </div>
    </div>

    <div class="wc-settings-actions">
      <button id="settings-cancel">Отмена</button>
      <button id="settings-save">Сохранить</button>
    </div>
  </section>

  <script src="../shared/convert.js"></script>
  <script src="../shared/flags.js"></script>
  <script src="../shared/crypto.js"></script>
  <script src="../shared/defaults.js"></script>
  <script src="../shared/format.js"></script>
  <script src="../shared/rates.js"></script>
  <script src="layout.js"></script>
  <script src="popup.js"></script>
</body>
</html>
